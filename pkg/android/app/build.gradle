plugins { id 'com.android.application' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

android {
    namespace 'com.corvussoftware.corvusretro'
    compileSdk 35
    ndkVersion '27.2.12479018'
    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['**/libcorvus_gb.so', '**/libcorvus_gbc.so', '**/libcorvus_gba.so']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.corvussoftware.corvusretro'
        testInstrumentationRunner project.findProperty('corvusTestRunner') ?: 'com.corvussoftware.corvusretro.CoreRepositoryInstrumentation'
        minSdk 26
        targetSdk 35
        versionCode project.hasProperty('corvusVersionCode')
                ? project.property('corvusVersionCode').toInteger()
                : 23
        versionName project.findProperty('corvusVersionName') ?: '0.18.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                targets 'corvusretro'
                arguments '-DCORVUS_OFFICIAL_CORES='
            }
        }
    }
    externalNativeBuild {
        cmake {
            path rootProject.file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    // Release signing is strictly opt-in and uses a private keystore OUTSIDE git.
    // Base updates reuse the exact certificate of the installed application.
    signingConfigs {
        corvusRelease {
            def releaseStore = System.getenv('CORVUS_RELEASE_KEYSTORE')
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv('CORVUS_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('CORVUS_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('CORVUS_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CORVUS_RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.corvusRelease
            }
        }
    }
}
