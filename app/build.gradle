plugins { id 'com.android.application' }

android {
    namespace 'com.corvussoftware.corvusretro'
    compileSdk 35
    ndkVersion '27.2.12479018'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.corvussoftware.corvusretro'
        minSdk 26
        targetSdk 35
        versionCode project.hasProperty('corvusCores') && project.property('corvusCores').toString().trim() ? 11 : 10
        versionName '0.10.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                // Build only the frontend for the base APK. Core modules become
                // dependencies solely when explicitly selected for a pack.
                targets 'corvusretro'
                arguments "-DCORVUS_OFFICIAL_CORES=${project.findProperty('corvusCores') ?: ''}"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    // Release signing is strictly opt-in and uses a private keystore OUTSIDE git.
    // APK core-pack updates must reuse the exact certificate of the installed app.
    signingConfigs {
        corvusRelease {
            def releaseStore = System.getenv('CORVUS_RELEASE_KEYSTORE')
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv('CORVUS_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('CORVUS_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('CORVUS_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CORVUS_RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.corvusRelease
            }
        }
    }
}
