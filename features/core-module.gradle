android {
    namespace "com.corvussoftware.corvusretro.${project.name}"
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 26
        targetSdk 35
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                targets "corvus_${project.corvusCore}"
                arguments "-DCORVUS_FEATURE_CORE=${project.corvusCore}"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path rootProject.file('features/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(':app') }
