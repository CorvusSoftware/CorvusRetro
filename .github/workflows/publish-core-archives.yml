name: Publish signed CorvusRetro APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional successful signed build run; otherwise select one for this exact commit"
        type: string
        required: false
      tag:
        description: "Existing tag at the current tested main commit, e.g. v0.18.1"
        type: string
        required: true
        default: v0.18.1

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish the tested Android base
    if: >-
      github.repository == 'CorvusSoftware/CorvusRetro' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUESTED_SOURCE_RUN: ${{ inputs.source_run_id }}
      CORVUS_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - name: Select a successful signed build for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CORVUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Android release tag"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release revision"; exit 1; }
          if test -n "$REQUESTED_SOURCE_RUN"; then
            [[ "$REQUESTED_SOURCE_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid signed build run ID"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_SOURCE_RUN" > "$RUNNER_TEMP/signed-run.json"
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-core-release.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" \
              > "$RUNNER_TEMP/signed-runs.json"
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def eligible(data):
              return (type(data.get('id')) is int and data['id'] > 0 and
                      data.get('path', '').split('@', 1)[0] == '.github/workflows/build-core-release.yml' and
                      data.get('status') == 'completed' and data.get('conclusion') == 'success' and
                      data.get('event') in ('workflow_run', 'workflow_dispatch') and
                      data.get('head_branch') == 'main' and
                      data.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY'] and
                      data.get('head_sha') == os.environ['GITHUB_SHA'])
          if os.environ.get('REQUESTED_SOURCE_RUN'):
              data = json.loads((root / 'signed-run.json').read_text())
              candidates = [data] if (eligible(data) and
                                     str(data['id']) == os.environ['REQUESTED_SOURCE_RUN']) else []
          else:
              runs = json.loads((root / 'signed-runs.json').read_text()).get('workflow_runs', [])
              candidates = [run for run in runs if eligible(run)]
          if not candidates:
              raise SystemExit('No successful signed build exists for this exact tested main commit')
          data = max(candidates, key=lambda run: run['id'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SOURCE_RUN_ID=' + str(data['id']) + '\n')
          print('Selected signed build run', data['id'])
          PY
          if gh release view "$CORVUS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; immutable APKs will not be overwritten"
            exit 1
          fi

      - name: Checkout the tested source and APK tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Verify the existing tag points to the qualified source revision
        run: |
          git ls-remote origin "refs/tags/$CORVUS_TAG" "refs/tags/$CORVUS_TAG^{}" > "$RUNNER_TEMP/release-tag.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'release-tag.txt').read_text().splitlines()
          refs = dict(line.split()[::-1] for line in lines)
          tag = 'refs/tags/' + os.environ['CORVUS_TAG']
          actual = refs.get(tag + '^{}', refs.get(tag))
          if actual != os.environ['GITHUB_SHA']:
              raise SystemExit('The release tag does not point to the qualified source commit')
          PY

      - name: Download only the matching signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "CorvusRetro-signed-$GITHUB_SHA" --dir "$RUNNER_TEMP/signed-base"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'signed-base'
          expected = {'CorvusRetro-base-release.apk', 'source.json'}
          if {path.name for path in root.iterdir()} != expected | {'SHA256SUMS'}:
              raise SystemExit('Unexpected qualification artifact files')
          lines = (root / 'SHA256SUMS').read_text().splitlines()
          checks = {}
          for line in lines:
              digest, name = line.split('  ', 1)
              if name not in expected or name in checks:
                  raise SystemExit('Unexpected or duplicate qualification artifact checksum')
              checks[name] = digest
          if set(checks) != expected:
              raise SystemExit('Incomplete qualification artifact checksums')
          for name, digest in checks.items():
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Qualification artifact checksum mismatch')
          provenance = json.loads((root / 'source.json').read_text())
          def revision(path):
              return subprocess.check_output(['git', '-C', path, 'rev-parse', 'HEAD'], text=True).strip()
          if (provenance.get('source_sha') != os.environ['GITHUB_SHA'] or
                  provenance.get('corvuscore_sha') != revision('deps/CorvusCore') or
                  provenance.get('corvusapi_sha') != revision('deps/CorvusCore/third_party/CorvusAPI') or
                  provenance.get('rcheevos_sha') != revision('deps/rcheevos')):
              raise SystemExit('Qualification artifact source provenance mismatch')
          PY
          mkdir -p pkg/android/app/build/outputs/apk/release
          cp "$RUNNER_TEMP/signed-base/CorvusRetro-base-release.apk" pkg/android/app/build/outputs/apk/release/app-release.apk
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the verified Android CLI
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/android-cli.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $RUNNER_TEMP/android-cli.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          echo "$RUNNER_TEMP/android-cli/cmdline-tools/bin" >> "$GITHUB_PATH"

      - name: Install signature and package inspection tools
        run: |
          python3 - <<'PY'
          import os, subprocess
          sdk = ['sdkmanager', '--sdk_root=' + os.environ['ANDROID_HOME']]
          subprocess.run(sdk + ['--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run(sdk + ['build-tools;35.0.0'], check=True)
          PY

      - name: Verify the pinned base signature and release version
        env:
          RELEASE_CERT: ${{ secrets.CORVUS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CERT" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Missing pinned release certificate"; exit 1; }
          python3 tools/check_core_apks.py --variant release \
            --expected-cert-sha256 "$RELEASE_CERT" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from android_artifacts import package_info
          info = package_info(Path('pkg/android/app/build/outputs/apk/release/app-release.apk'),
                              os.environ['ANDROID_HOME'] + '/build-tools/35.0.0/aapt')
          if os.environ['CORVUS_TAG'] != 'v' + info.get('versionName', ''):
              raise SystemExit('Release tag does not match the qualified app version')
          if int(info['versionCode']) < 13:
              raise SystemExit('This APK publication flow requires base versionCode 13 or newer')
          PY

      - name: Publish the exact qualified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_base="$RUNNER_TEMP/CorvusRetro-${CORVUS_TAG#v}-base-release.apk"
          cp "$RUNNER_TEMP/signed-base/CorvusRetro-base-release.apk" "$release_base"
          gh release create "$CORVUS_TAG" "$release_base" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag --prerelease \
            --title "CorvusRetro $CORVUS_TAG" \
            --notes "Base Android signée sans moteur embarqué. Installer ou actualiser les cœurs séparément dans le téléchargeur, depuis les catalogues de CorvusRepository. Les versions des cœurs sont indépendantes de l'APK. Android 8.0+."
          echo "APK published. Native modules and provider catalogs are released independently by CorvusRepository." >> "$GITHUB_STEP_SUMMARY"
