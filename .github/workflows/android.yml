name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          # Use the same Google CLI version verified in the cloud environment.
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/android-cli.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $RUNNER_TEMP/android-cli.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          echo "$RUNNER_TEMP/android-cli/cmdline-tools/bin" >> "$GITHUB_PATH"

      - name: Install pinned Android packages
        run: |
          python3 - <<'PY'
          import os, subprocess
          sdk = ['sdkmanager', '--sdk_root=' + os.environ['ANDROID_HOME']]
          subprocess.run(sdk + ['--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run(sdk + ['platforms;android-35', 'build-tools;35.0.0', 'ndk;27.2.12479018', 'cmake;3.22.1'], check=True)
          PY

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Check repository text policy
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          forbidden = {chr(value) for value in (0x2012, 0x2013, 0x2014, 0x2015, 0x2e3a, 0x2e3b)}
          failures = []
          for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if any(character in text for character in forbidden):
                  failures.append(name)
          if failures:
              raise SystemExit('Long Unicode dashes are forbidden: ' + ', '.join(failures))
          print('PASS repository text policy')
          PYCODE

      - name: Validate official Corvus Core Repository metadata
        run: |
          python3 tools/validate_core_catalog.py
          python3 tools/test_core_catalog.py

      - name: Test native C frontend and CorvusCore engines
        run: make test CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Check original C code with memory sanitizers
        run: make test SANITIZE=ON CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Build APK and run Android lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify bundled CorvusAPI core modules
        run: |
          for abi in arm64-v8a x86_64; do
            for core in gb gbc gba; do
              unzip -Z -1 app/build/outputs/apk/debug/app-debug.apk |
                grep -Fx "lib/$abi/libcorvus_$core.so"
            done
          done

      - name: Verify APK signature and 16 KB alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CorvusRetro-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
